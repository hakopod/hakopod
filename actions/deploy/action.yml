name: Deploy to Hakopod
description: Deploy selected services in an existing Hakopod application and wait for the rollout.
author: Hakopod
branding:
  icon: upload-cloud
  color: red
inputs:
  api-url:
    description: Public Hakopod HTTPS origin or API URL ending in /api/v1.
    required: true
  api-token:
    description: Scoped Hakopod token with deployments:read and deployments:write.
    required: true
  application-id:
    description: ID of the existing application to deploy.
    required: true
  services:
    description: JSON array of service names or objects with name, image, env, and secrets.
    required: true
  image:
    description: Optional image pinned by sha256 digest for all selected services.
  env:
    description: JSON object of plain environment changes for selected services; null removes a service override.
    default: '{}'
  workspace:
    description: Optional Hakopod Cloud workspace ID.
  wait:
    description: Wait for successful rollout; false returns after acceptance.
    default: 'true'
  timeout:
    description: Total action timeout in seconds, from 1 to 3600.
    default: '600'
  poll-interval:
    description: Seconds between deployment status checks, from 1 to 60.
    default: '5'
outputs:
  deployment-id:
    description: Accepted deployment ID, also available when rollout fails or times out.
  application-id:
    description: Target application ID.
  revision:
    description: Accepted application revision.
  status:
    description: Last observed deployment status. Only succeeded confirms rollout success.
  idempotency-key:
    description: Request key for recovering an ambiguous deployment submission.
runs:
  using: node24
  main: index.mjs
