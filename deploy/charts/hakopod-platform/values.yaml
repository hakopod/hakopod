# This profile exposes only HTTP/HTTPS through a NodePort on the isolated k3d node.
# The k3d container binds those ports to host loopback. No public load balancer.
kubernetes-ingress:
  controller:
    replicaCount: 1
    image:
      tag: "3.2.15@sha256:6185ab228aa6a8f56fd8909e55fa4bbf82f6c765a28fe7e6cea69a7668f487e8"
    ingressClass: haproxy
    ingressClassResource:
      name: haproxy
      default: false
    enableServiceLinks: false
    extraEnvs:
      - name: GOMEMLIMIT
        value: 160MiB
      - name: GOMAXPROCS
        value: "2"
    extraArgs:
      - --disable-quic
    prometheus:
      enabled: false
    pprof:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 256Mi
    config:
      nbthread: "2"
      maxconn: "1024"
      timeout-connect: "5s"
      timeout-client: "30s"
      timeout-server: "30s"
    service:
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443
      enablePorts:
        http: true
        https: true
        quic: false
        stat: false
        admin: false
    defaultTLSSecret:
      enabled: false
    publishService:
      enabled: false
  crdjob:
    ttlSecondsAfterFinished: 30
    activeDeadlineSeconds: 120
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
