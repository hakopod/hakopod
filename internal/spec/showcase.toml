[services.api]
image = "python:3.13.15-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a"
port = 8080
size = "small"
healthcheck = "/readyz"
command = ["python", "-u", "-c"]
args = ['''
import http.server,json,socket
PRODUCTS=[{'id':'lamp','name':'Desk light','price':4900,'description':'A little warmth for your workspace.'},{'id':'cup','name':'Everyday cup','price':1800,'description':'A simple shape for the daily ritual.'},{'id':'tray','name':'Pocket tray','price':2900,'description':'A home for the small things.'}]
class API(http.server.BaseHTTPRequestHandler):
 def setup(self):
  super().setup();self.connection.settimeout(5)
 def send(self,status,data):
  body=json.dumps(data).encode();self.send_response(status);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
 def do_GET(self):
  if self.path=='/readyz':self.send(200,{'ready':True})
  elif self.path=='/catalog':self.send(200,{'sample':True,'products':PRODUCTS,'pod':socket.gethostname()})
  else:self.send(404,{'error':'not found'})
 def do_POST(self):
  try:
   n=int(self.headers.get('Content-Length','0'));assert self.path=='/checkout' and 0<n<=2048
   cart=json.loads(self.rfile.read(n));prices={p['id']:p['price'] for p in PRODUCTS};assert isinstance(cart,dict) and 0<len(cart)<=3
   assert all(k in prices and type(v) is int and 1<=v<=9 for k,v in cart.items())
   self.send(200,{'sample':True,'total':sum(prices[k]*v for k,v in cart.items()),'order_created':False})
  except Exception:self.send(400,{'error':'invalid sample basket'})
http.server.HTTPServer(('0.0.0.0',8080),API).serve_forever()
''']
[services.api.env]
HAKOPOD_SAMPLE = "true"
