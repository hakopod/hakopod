command = ["python", "-u", "-c"]
args = ['''
import http.server,os,urllib.request,urllib.error
import sys
PAGE=sys.argv[1].encode()
class Web(http.server.BaseHTTPRequestHandler):
 def setup(self):
  super().setup();self.connection.settimeout(5)
 def send(self,status,kind,body):
  self.send_response(status);self.send_header('Content-Type',kind);self.send_header('Content-Length',str(len(body)));self.send_header('Cache-Control','no-store');self.end_headers();self.wfile.write(body)
 def proxy(self,data=None):
  try:
   req=urllib.request.Request(os.environ['API_URL']+self.path[4:],data=data,headers={'Content-Type':'application/json'})
   with urllib.request.urlopen(req,timeout=3) as r: body=r.read(65536);self.send(r.status,'application/json',body)
  except Exception:self.send(503,'text/plain',b'Private API is unavailable')
 def do_GET(self):
  if self.path=='/readyz':self.send(200,'text/plain',b'ready')
  elif self.path=='/api/catalog':self.proxy()
  elif self.path=='/':self.send(200,'text/html; charset=utf-8',PAGE)
  else:self.send(404,'text/plain',b'Not found')
 def do_POST(self):
  try:n=int(self.headers.get('Content-Length','0'))
  except ValueError:n=0
  if self.path!='/api/checkout' or n<1 or n>2048:self.send(400,'text/plain',b'Invalid sample checkout');return
  self.proxy(self.rfile.read(n))
http.server.HTTPServer(('0.0.0.0',8080),Web).serve_forever()
''', '''<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio shop | Hakopod sample</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#ececf0;font:16px system-ui}main{max-width:1000px;margin:auto;padding:32px 24px}header,footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.tag{color:#c3aff3;font-size:13px}h1{font-size:clamp(36px,7vw,68px);max-width:650px;line-height:1.05;letter-spacing:-2px;margin:64px 0 20px}p{color:#aaaab5;line-height:1.6}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:48px 0}.card{border:1px solid #303039;border-radius:16px;overflow:hidden;background:#1a1a20}.art{height:170px;display:grid;place-items:center;background:linear-gradient(135deg,#39313e,#1e202b)}.shape{width:65px;height:85px;border:10px solid #cbbca4;border-radius:18px;box-shadow:12px 14px 0 #0003}.card:nth-child(2) .shape{border-radius:50%;border-color:#b9abc8}.card:nth-child(3) .shape{width:85px;height:30px;border-color:#8ead9b;transform:rotate(-15deg)}.copy{padding:22px}h2{font-size:20px;margin:0}button{background:#c3aff3;border:0;color:#171220;padding:11px 18px;border-radius:8px;font:600 14px system-ui;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.buy{display:flex;justify-content:space-between;align-items:center;margin-top:24px}aside{padding:24px;border:1px solid #303039;border-radius:12px;margin-bottom:48px}footer{font-size:12px;color:#9695a4;padding:24px 0;border-top:1px solid #303039}#notice{min-height:24px;color:#c3aff3}</style><main><header><strong>STUDIO / SHOP</strong><span class="tag">HAKOPOD SAMPLE APPLICATION</span></header><h1>Your small shop.</h1><p>Sample products, a real private API.<br>No payments, accounts, or real orders are collected.</p><section id="items" aria-label="Sample products">Loading the catalog...</section><aside><h2>Your sample basket</h2><p id="basket">Your basket is empty.</p><button id="checkout" disabled>Try sample checkout</button><p id="notice" role="status" aria-live="polite"></p><p>Reloading clears the basket. Remove this sample from Hakopod when you are ready.</p></aside><footer><span>Public web → private API. One ordinary Hakopod application.</span><span id="runtime">Waiting for the private API</span></footer></main><script>let products=[],cart={};const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100);function render(){const count=Object.values(cart).reduce((a,b)=>a+b,0),total=products.reduce((a,p)=>a+(cart[p.id]||0)*p.price,0);$('basket').textContent=count?count+' sample items / '+money(total):'Your basket is empty.';$('checkout').disabled=!count}fetch('/api/catalog').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{products=d.products;$('items').textContent='';products.forEach(p=>{let card=document.createElement('article');card.className='card';card.innerHTML='<div class="art" aria-hidden="true"><div class="shape"></div></div><div class="copy"><h2></h2><p></p><div class="buy"><strong></strong><button>Add sample</button></div></div>';card.querySelector('h2').textContent=p.name;card.querySelector('p').textContent=p.description;card.querySelector('strong').textContent=money(p.price);card.querySelector('button').onclick=()=>{cart[p.id]=Math.min(9,(cart[p.id]||0)+1);render()};$('items').append(card)});$('runtime').textContent='Live API: '+d.pod}).catch(()=>{$('items').textContent='The private API is unavailable. Inspect this application in Hakopod.'});$('checkout').onclick=async()=>{try{let r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cart)});if(!r.ok)throw Error();let d=await r.json();$('notice').textContent='Sample checkout received: '+money(d.total)+'. No payment or order was created.';cart={};render()}catch{$('notice').textContent='Checkout could not reach the private API.'}};</script></html>''']
