name: Mathesar runtime acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'templates'
      - 'internal/spec/templates.go'
      - 'internal/spec/mathesar_template_test.go'
      - 'internal/cluster/live_mathesar_test.go'
      - '.github/workflows/mathesar-runtime.yml'
permissions:
  contents: read
concurrency:
  group: mathesar-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      HAKOPOD_TEST_KUBECONFIG: ${{ github.workspace }}/.local/kubeconfig
      HAKOPOD_MATHESAR_TEST: '1'
      HAKOPOD_MATHESAR_SINGLE_NODE_FIXTURE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git submodule update --init templates
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.2
      - name: Start disposable named development cluster
        run: |
          scripts/local-up.sh
          kubectl --kubeconfig "$HAKOPOD_TEST_KUBECONFIG" --context k3d-hakopod-dev apply -f deploy/storage/local-path.yaml
          kubectl --kubeconfig "$HAKOPOD_TEST_KUBECONFIG" --context k3d-hakopod-dev -n hakopod-storage rollout status deployment/local-path-provisioner --timeout=120s
      - name: Verify Mathesar runtime and durable data
        # This explicit single-node shared-filesystem fixture exercises real
        # volume sharing; it is not a production RWX storage qualification.
        run: go test ./internal/cluster -run '^TestLiveMathesarTemplate$' -count=1 -timeout=22m -v
