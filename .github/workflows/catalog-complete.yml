name: Complete catalog runtime acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'templates'
      - 'internal/cluster/live_complete_catalog_test.go'
      - 'internal/spec/catalog_complete_test.go'
      - '.github/workflows/catalog-complete.yml'
permissions:
  contents: read
concurrency:
  group: complete-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        template: [dagu, couchdb, blinko, bytebase, baserow]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      HAKOPOD_TEST_KUBECONFIG: ${{ github.workspace }}/.local/kubeconfig
      HAKOPOD_DEV_SERVER_MEMORY: 6g
      HAKOPOD_COMPLETE_CATALOG_TEST: '1'
      HAKOPOD_CATALOG_TEMPLATE: ${{ matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git submodule update --init templates
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.2
      - name: Start a bounded disposable development cluster
        run: |
          scripts/local-up.sh
          kubectl --kubeconfig "$HAKOPOD_TEST_KUBECONFIG" --context k3d-hakopod-dev apply -f deploy/storage/local-path.yaml
          kubectl --kubeconfig "$HAKOPOD_TEST_KUBECONFIG" --context k3d-hakopod-dev -n hakopod-storage rollout status deployment/local-path-provisioner --timeout=120s
      - name: Verify real application startup, credentials and persistence
        run: go test ./internal/cluster -run '^TestLiveCompleteCatalog$' -count=1 -v -timeout=25m
