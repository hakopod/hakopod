name: Installer acceptance
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate package version
        required: false
        default: 0.1.0-alpha.3
        type: string
  pull_request:
    paths:
      - 'installer/**'
      - 'release/**'
      - 'scripts/install*.sh'
      - '.github/workflows/installer-*.yml'
      - '.github/workflows/release.yml'
permissions:
  contents: read
concurrency:
  group: installer-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      NODE_OPTIONS: --max-old-space-size=512
      RELEASE_VERSION: ${{ inputs.version || '0.1.0-alpha.3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build exact candidate packages
        run: |
          python3 release/publication.py version "v$RELEASE_VERSION"
          python3 scripts/ui-source.py restore
          pnpm --dir web install --frozen-lockfile
          python3 -m unittest discover -s installer -p 'test_*.py'
          python3 -m unittest discover -s release -p 'test_*.py'
          python3 release/build.py --version "$RELEASE_VERSION"
          python3 release/build-installer.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-candidate
          path: .local/installer-artifacts/${{ env.RELEASE_VERSION }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  hosts:
    needs: build
    uses: ./.github/workflows/installer-hosts.yml
    with:
      version: ${{ inputs.version || '0.1.0-alpha.3' }}
      artifact_name: installer-candidate
  smoke:
    needs: build
    uses: ./.github/workflows/installer-smoke.yml
    with:
      version: ${{ inputs.version || '0.1.0-alpha.3' }}
      artifact_name: installer-candidate
