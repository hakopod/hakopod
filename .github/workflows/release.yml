name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      NODE_OPTIONS: --max-old-space-size=512
      HAKOPOD_TEST_DATABASE_URL: postgres://hakopod_release:ephemeral-release-only@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: hakopod_release
          POSTGRES_PASSWORD: ephemeral-release-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hakopod_release -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag and source
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 release/publication.py version "$RELEASE_TAG")
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Restore public template catalog
        run: git submodule update --init templates
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Test source and restore public UI
        run: |
          python3 scripts/ui-source.py restore
          pnpm --dir web install --frozen-lockfile
          go test ./...
          go vet ./...
          python3 -m unittest discover -s installer -p 'test_*.py'
          python3 -m unittest discover -s release -p 'test_*.py'
          sh -n scripts/installer.sh
          bash -n scripts/install.sh
          pnpm --dir web typecheck
          pnpm --dir web test
      - name: Build, inspect and package prebuilt artifacts
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 release/build.py --version "$RELEASE_VERSION"
          python3 release/build-installer.py --version "$RELEASE_VERSION"
          python3 release/bootstrap-version.py ".local/installer-artifacts/$RELEASE_VERSION" "$RELEASE_VERSION"
          python3 release/publication.py assemble "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: .local/publication/${{ steps.release.outputs.version }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  smoke:
    needs: build
    uses: ./.github/workflows/installer-smoke.yml
    with:
      version: ${{ needs.build.outputs.version }}
      artifact_name: release-assets
  hosts:
    needs: build
    uses: ./.github/workflows/installer-hosts.yml
    with:
      version: ${{ needs.build.outputs.version }}
      artifact_name: release-assets
  probe:
    needs: [build, smoke, hosts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and smoke the native probe image
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker buildx build --file Dockerfile.probe --platform "linux/$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --provenance=false --load --tag hakopod-probe:release .
          python3 release/smoke-probe.py --image hakopod-probe:release --arch "$ARCH" --output "probe-smoke-$ARCH.json"
      - name: Push the tested platform image
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}-probe"
          # Run-scoped tags avoid overwriting a published version during partial retries.
          tag="$image:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag hakopod-probe:release "$tag"
          docker push "$tag"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
          printf '%s@%s\n' "$image" "$digest" > "probe-$ARCH.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-${{ matrix.arch }}
          path: |
            probe-${{ matrix.arch }}.txt
            probe-smoke-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7
  probe-index:
    needs: [build, probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.index.outputs.image }}
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: probe-*
          merge-multiple: true
          path: .local/probe
      - name: Publish versioned multi-platform probe
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}-probe"
          docker buildx imagetools create --tag "$image:$RELEASE_TAG" \
            "$(cat .local/probe/probe-amd64.txt)" "$(cat .local/probe/probe-arm64.txt)"
          digest=$(docker buildx imagetools inspect "$image:$RELEASE_TAG" --format '{{.Manifest.Digest}}')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$image" "$digest" > .local/probe/probe-image.txt
          # Fail publication if self-hosted nodes cannot pull without credentials.
          # GHCR package settings must be Public before the first release completes.
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$image@$digest" > .local/probe/probe-index.json
          python3 release/probe-metadata.py .local/probe "$RELEASE_TAG" "$GITHUB_SHA"
          for arch in amd64 arm64; do
            # Classic Docker stores cannot bind one index digest to two local architectures.
            # Metadata verification above binds each child to the tested release index.
            platform_image=$(cat ".local/probe/probe-$arch.txt")
            DOCKER_CONFIG="$anonymous_config" docker pull --platform "linux/$arch" "$platform_image"
          done
      - name: Attest the probe index
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3.0.0
        with:
          subject-name: ${{ steps.index.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-release
          path: |
            .local/probe/probe-image.txt
            .local/probe/probe-image.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build, smoke, hosts, probe-index]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: .local/publication/${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-smoke-amd64
          path: .local/publication/${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-smoke-arm64
          path: .local/publication/${{ needs.build.outputs.version }}
      - name: Bind smoke evidence to artifact checksums
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python3 release/publication.py finalize ".local/publication/$RELEASE_VERSION"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-host-*
          path: .local/host-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: probe-release
          path: .local/publication/${{ needs.build.outputs.version }}
      - name: Retain native host acceptance evidence
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, runpy
          from pathlib import Path
          reports = sorted(Path('.local/host-evidence').glob('*/host-report.json'))
          values = [json.loads(path.read_text()) for path in reports]
          directory = Path('.local/publication') / os.environ['RELEASE_VERSION']
          runpy.run_path('release/host-acceptance.py')['verify_reports'](directory, values, os.environ['RELEASE_VERSION'], os.environ['GITHUB_SHA'])
          target = directory / 'host-acceptance.json'
          target.write_text(json.dumps(values, indent=2) + '\n')
          publication = runpy.run_path('release/publication.py')
          (directory / 'SHA256SUMS').write_text(publication['manifest'](directory))
          publication['verify'](directory)
          PY
      - name: Attest release archives, SBOMs and checksum manifest
        id: attest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3.0.0
        with:
          subject-path: .local/publication/${{ needs.build.outputs.version }}/*
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          directory=".local/publication/$RELEASE_VERSION"
          cp "$ATTESTATION_BUNDLE" "$directory/build-provenance.intoto.jsonl"
          python3 release/publication.py verify "$directory"
          python3 release/bootstrap-version.py "$directory" "$RELEASE_VERSION"
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$RELEASE_TAG" "$directory"/* --verify-tag --draft "${flags[@]}" \
            --title "Hakopod $RELEASE_VERSION" --notes-file release/notes.md
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
