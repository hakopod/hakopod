name: Managed Actions real GitHub jobs
on:
  workflow_dispatch:
    inputs:
      observer:
        type: boolean
        default: false
      cache:
        description: Verify native GitHub cache across two fresh managed jobs
        type: boolean
        default: false
      runner_label:
        type: string
        default: unused-observer-fixture
      jit_secret:
        type: string
        default: HAKOPOD_UNUSED_OBSERVER_JIT
      restore_runner_label:
        description: Second single-job runner label for the cache restore job
        type: string
        default: unused-cache-restore-fixture
permissions:
  contents: read
concurrency:
  group: managed-actions-live
  cancel-in-progress: false
jobs:
  sandbox:
    if: ${{ !inputs.observer || inputs.cache }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HAKOPOD_DEV_SERVER_MEMORY: 6g
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git submodule update --init templates
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.2
      - run: scripts/local-up.sh
      - name: Install sandbox on the disposable development node
        run: |
          python3 scripts/actions/setup-dev-runtime.py
          sleep 10
          kubectl --kubeconfig .local/kubeconfig --context k3d-hakopod-dev wait --for=condition=Ready nodes --all --timeout=180s
      - name: Run product runner pods with single-job credentials
        env:
          HAKOPOD_ACTIONS_TEST_JIT: ${{ secrets[inputs.cache && inputs.jit_secret || 'HAKOPOD_ACTIONS_ACCEPTANCE_JIT'] }}
        run: |
          test -n "$HAKOPOD_ACTIONS_TEST_JIT"
          export KUBECONFIG="$PWD/.local/kubeconfig"
          go test -p=1 ./internal/cluster -run '^TestManagedActionsGitHubJobsLive$' -v -count=1 -timeout=25m
      - name: Diagnose disposable runner pods
        if: failure()
        run: |
          kubectl --kubeconfig .local/kubeconfig --context k3d-hakopod-dev get pods -A
          kubectl --kubeconfig .local/kubeconfig --context k3d-hakopod-dev get events -A --sort-by=.lastTimestamp | tail -50
          kubectl --kubeconfig .local/kubeconfig --context k3d-hakopod-dev get pods -A -o json | python3 -c 'import json,sys; [print(p["metadata"]["namespace"], p["metadata"]["name"]) for p in json.load(sys.stdin)["items"] if p["metadata"]["name"].startswith("actions-")]' | while read -r namespace pod; do
            for container in prepare docker; do
              kubectl --kubeconfig .local/kubeconfig --context k3d-hakopod-dev -n "$namespace" logs "$pod" -c "$container" --tail=40 || true
            done
          done
      - name: Stop disposable cluster
        if: always()
        run: scripts/local-down.sh
  shell-and-docker:
    if: ${{ !inputs.observer && !inputs.cache }}
    runs-on: [self-hosted, hakopod-live-shell]
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.6.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Shell, JavaScript checkout and host service ports
        run: |
          test -f go.mod
          docker info > /dev/null
          if DOCKER_HOST="tcp://$(hostname -i):2375" docker version > /dev/null 2>&1; then
            echo 'Docker must not listen on the externally reachable pod address'
            exit 1
          fi
          docker run --rm --network host redis:8.6.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36 redis-cli -h 127.0.0.1 ping | grep PONG
          cat > actions-fixture.sh <<'SCRIPT'
          set -eu
          test -f /github/workspace/go.mod
          echo docker-action-ok > /github/workspace/actions-fixture.txt
          SCRIPT
      - name: Docker image action and shared workspace
        uses: docker://busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        with:
          args: sh /github/workspace/actions-fixture.sh
      - name: Docker build with RUN and bind mounts
        run: |
          test "$(cat actions-fixture.txt)" = docker-action-ok
          mkdir -p /home/runner/actions-build
          cat > /home/runner/actions-build/Dockerfile <<'DOCKERFILE'
          FROM busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          RUN echo built-inside-sandbox > /proof
          CMD ["cat", "/proof"]
          DOCKERFILE
          docker build -t managed-actions-fixture /home/runner/actions-build
          docker run --rm managed-actions-fixture | grep built-inside-sandbox
  container-job:
    if: ${{ !inputs.observer && !inputs.cache }}
    runs-on: [self-hosted, hakopod-live-container]
    timeout-minutes: 20
    container:
      image: redis:8.6.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
    services:
      redis:
        image: redis:8.6.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
    steps:
      - name: Job container and service container DNS
        run: |
          redis-cli -h redis ping | grep PONG
          echo job-container-ok > "$GITHUB_WORKSPACE/container-proof"
          test "$(cat "$GITHUB_WORKSPACE/container-proof")" = job-container-ok

  observer-host:
    if: ${{ inputs.observer && !inputs.cache }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      HAKOPOD_DEV_SERVER_MEMORY: 6g
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git submodule update --init templates
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.2
      - run: scripts/local-up.sh
      - name: Install development sandbox
        run: |
          python3 scripts/actions/setup-dev-runtime.py
          sleep 10
          kubectl --kubeconfig .local/kubeconfig --context k3d-hakopod-dev wait --for=condition=Ready nodes --all --timeout=180s
          python3 - <<'PYRUNTIME'
          import json,subprocess
          runtime={'apiVersion':'node.k8s.io/v1','kind':'RuntimeClass','metadata':{'name':'hakopod-actions','labels':{'app.kubernetes.io/managed-by':'hakopod'}},'handler':'hakopod-actions','scheduling':{'nodeSelector':{'hakopod.io/actions-runtime':'ready'}},'overhead':{'podFixed':{'cpu':'100m','memory':'512Mi'}}}
          kube=['kubectl','--kubeconfig','.local/kubeconfig','--context','k3d-hakopod-dev']
          subprocess.run(kube+['create','-f','-'],input=json.dumps(runtime),text=True,check=True)
          subprocess.run(kube+['label','node','k3d-hakopod-dev-server-0','hakopod.io/actions-runtime=ready'],check=True)
          PYRUNTIME
      - name: Verify live masked output and completed GitHub logs
        env:
          FIXTURE_JSON: ${{ secrets[inputs.jit_secret] }}
          READ_TOKEN: ${{ github.token }}
          HAKOPOD_ACTIONS_OBSERVER_TEST: '1'
          HAKOPOD_ACTIONS_OBSERVER_EXTERNAL_CLEANUP: '1'
        run: |
          python3 - <<'PYFIXTURE'
          import json,os,pathlib
          root=pathlib.Path('.local/observer-fixture');root.mkdir(mode=0o700)
          data=json.loads(os.environ['FIXTURE_JSON'])
          values={'jit':data['encoded_jit_config'],'identity':json.dumps({'slot_id':data['runner']['name'].removeprefix('hakopod-'),'runner_id':data['runner']['id']}),'token':os.environ['READ_TOKEN']}
          for name,value in values.items():
              fd=os.open(root/name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'w') as output: output.write(value)
          PYFIXTURE
          export HAKOPOD_TEST_KUBECONFIG="$PWD/.local/kubeconfig"
          export HAKOPOD_ACTIONS_OBSERVER_JIT="$PWD/.local/observer-fixture/jit"
          export HAKOPOD_ACTIONS_OBSERVER_IDENTITY="$PWD/.local/observer-fixture/identity"
          export HAKOPOD_ACTIONS_OBSERVER_TOKEN="$PWD/.local/observer-fixture/token"
          unset FIXTURE_JSON READ_TOKEN
          go test -p=2 ./internal/cluster -run '^TestManagedWorkflowObserverLive$' -v -count=1 -timeout=16m
      - name: Stop disposable cluster
        if: always()
        run: scripts/local-down.sh
  observer-job:
    if: ${{ inputs.observer && !inputs.cache }}
    runs-on: [self-hosted, '${{ inputs.runner_label }}']
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile native program
        run: |
          printf '#include <stdio.h>\nint main(void){puts("native-toolchain-ok");return 0;}\n' > /tmp/hakopod-native.c
          cc /tmp/hakopod-native.c -o /tmp/hakopod-native
          /tmp/hakopod-native
      - name: Verify grouped masked output while running
        shell: bash
        run: |
          mask=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "::add-mask::$mask"
          echo '::group::Masked development fixture output'
          for number in $(seq 1 15); do
            echo "workflow-visible-line-$number $mask"
            sleep 2
          done
          echo '::endgroup::'

  cache-save:
    if: ${{ inputs.cache }}
    runs-on: [self-hosted, '${{ inputs.runner_label }}']
    timeout-minutes: 10
    outputs:
      runner: ${{ steps.fixture.outputs.runner }}
      checksum: ${{ steps.fixture.outputs.checksum }}
      key: ${{ steps.fixture.outputs.key }}
    steps:
      - name: Create a bounded dependency cache fixture
        id: fixture
        env:
          FIXTURE_RUNNER: ${{ runner.name }}
          FIXTURE_KEY: hakopod-managed-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-${{ runner.arch }}
        run: |
          set -eu
          test ! -e .hakopod-cache-fixture
          tar --version | head -1
          if command -v zstd; then zstd --version; else echo 'Cache archive uses gzip'; fi
          mkdir .hakopod-cache-fixture
          dd if=/dev/urandom of=.hakopod-cache-fixture/payload bs=1048576 count=8 status=none
          printf '%s\n' "$FIXTURE_RUNNER" > .hakopod-cache-fixture/source-runner
          checksum=$(sha256sum .hakopod-cache-fixture/payload | cut -d ' ' -f1)
          printf 'runner=%s\nchecksum=%s\nkey=%s\n' "$FIXTURE_RUNNER" "$checksum" "$FIXTURE_KEY" >> "$GITHUB_OUTPUT"
      - name: Save to GitHub's repository and branch scoped cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .hakopod-cache-fixture
          key: ${{ steps.fixture.outputs.key }}

  cache-restore:
    if: ${{ inputs.cache }}
    needs: cache-save
    runs-on: [self-hosted, '${{ inputs.restore_runner_label }}']
    timeout-minutes: 10
    steps:
      - name: Verify a different runner starts without the first job's files
        env:
          SOURCE_RUNNER: ${{ needs.cache-save.outputs.runner }}
          CURRENT_RUNNER: ${{ runner.name }}
        run: |
          set -eu
          test -n "$SOURCE_RUNNER"
          test "$CURRENT_RUNNER" != "$SOURCE_RUNNER"
          test ! -e .hakopod-cache-fixture
      - name: Restore the exact saved cache
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: .hakopod-cache-fixture
          key: ${{ needs.cache-save.outputs.key }}
          fail-on-cache-miss: true
      - name: Verify cross-job cache identity and contents
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          EXPECTED_SHA: ${{ needs.cache-save.outputs.checksum }}
          SOURCE_RUNNER: ${{ needs.cache-save.outputs.runner }}
          CACHE_KEY: ${{ needs.cache-save.outputs.key }}
        run: |
          set -eu
          test "$CACHE_HIT" = true
          test "$(cat .hakopod-cache-fixture/source-runner)" = "$SOURCE_RUNNER"
          printf '%s  .hakopod-cache-fixture/payload\n' "$EXPECTED_SHA" | sha256sum --check --strict
          printf 'Verified an exact GitHub cache hit on a different managed runner: `%s` (8 MiB payload).\n' "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"
