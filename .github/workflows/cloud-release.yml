name: Publish @hakopod/cloud
on:
  push:
    tags: ['cloud-v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No registry-url on purpose. It writes an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN}, and with NODE_AUTH_TOKEN unset npm reads an
      # empty credential, believes it is authenticated, skips the OIDC exchange and
      # PUTs anonymously. The registry answers 404, not 401, so the cause is invisible.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify version and package
        working-directory: packages/cli
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(process.env.GITHUB_REF_NAME!==`cloud-v${p.version}`) process.exit(1)'
          npm test
          npm pack --dry-run
      - name: Publish using npm trusted publishing
        working-directory: packages/cli
        run: npm publish --provenance --access public --tag latest
