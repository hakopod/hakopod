name: Outpost runtime acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'templates'
      - 'internal/spec/outpost_template*'
      - 'internal/spec/templates.go'
      - 'internal/spec/bindings.go'
      - 'internal/spec/template_requirements.go'
      - 'internal/cluster/live_outpost_template_test.go'
      - '.github/workflows/outpost-runtime.yml'
permissions:
  contents: read
concurrency:
  group: outpost-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        # Bits select external PostgreSQL, Redis and RabbitMQ respectively.
        # These are real, separately named private development dependencies.
        modes: ['000', '001', '010', '011', '100', '101', '110', '111']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      HAKOPOD_DEV_SERVER_MEMORY: 5g
      HAKOPOD_TEST_KUBECONFIG: ${{ github.workspace }}/.local/kubeconfig
      HAKOPOD_OUTPOST_TEST: '1'
      HAKOPOD_OUTPOST_TEST_MODES: ${{ matrix.modes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git submodule update --init templates
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.2
      - name: Start disposable named development cluster
        run: |
          scripts/local-up.sh
          kubectl --kubeconfig "$HAKOPOD_TEST_KUBECONFIG" --context k3d-hakopod-dev apply -f deploy/storage/local-path.yaml
          kubectl --kubeconfig "$HAKOPOD_TEST_KUBECONFIG" --context k3d-hakopod-dev -n hakopod-storage rollout status deployment/local-path-provisioner --timeout=120s
      - name: Verify real migration, auth, private delivery and durable data
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .local/outpost-evidence
          go test ./internal/cluster -run '^TestLiveOutpostTemplate$' -count=1 -timeout=27m -v 2>&1 | tee .local/outpost-evidence/runtime.log
      - name: Preserve bounded acceptance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outpost-runtime-${{ matrix.runner }}-${{ matrix.modes }}
          path: .local/outpost-evidence/runtime.log
          if-no-files-found: ignore
          retention-days: 7
