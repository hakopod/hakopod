name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 512MiB
      HAKOPOD_TEST_DATABASE_URL: postgres://hakopod_ci:ephemeral-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: hakopod_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hakopod_ci -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Check signup build policies
        run: |
          go test -tags=hakopod_cloud ./cmd/hakopod-server
          go test -tags=hakopod_cloud,hakopod_selfhosted ./cmd/hakopod-server
      - run: go vet ./...
      - run: go build ./cmd/...
      - name: Check scripts
        run: |
          bash -n scripts/local-tools.sh scripts/local-up.sh scripts/local-down.sh scripts/install.sh release/install-syft.sh deploy/cert-manager/install.sh
          python3 -m py_compile scripts/*.py api/generate.py api/contracts/*.py examples/shop/variants.py tests/restart.py release/*.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s installer -p 'test_*.py'
          python3 -m unittest discover -s release -p 'test_*.py'
          sh -n scripts/installer.sh
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore public design-system sources
        run: python3 scripts/ui-source.py restore
        working-directory: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
