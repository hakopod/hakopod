name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci
      - name: Check the generated API contract
        working-directory: .
        run: |
          python3 api/generate.py
          git diff --exit-code -- api/openapi.json
      - run: npm test
      - run: npm run check:generated
      - run: npm pack --dry-run
  server-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore public template catalog
        run: git submodule update --init templates
      - name: Build the server image with local module replacements
        run: docker build --build-arg TARGETARCH=amd64 --tag hakopod-server:ci .
  go:
    runs-on: ubuntu-24.04
    # Both the standard and native acceptance suites exercise the database.
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 512MiB
      HAKOPOD_TEST_DATABASE_URL: postgres://hakopod_ci:ephemeral-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      HAKOPOD_DEPLOY_ACTION_PATH: ${{ github.workspace }}/.local/deploy-action
      TEST_KUBECTL: ${{ github.workspace }}/.local/bin/kubectl
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: hakopod_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hakopod_ci -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the standalone deployment action for API acceptance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hakopod/deploy
          ref: 8b3a7e4927761e9dbc4128441b67a06993082183
          path: .local/deploy-action
          persist-credentials: false
      - name: Restore public template catalog
        run: git submodule update --init templates
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install the pinned client for offline Kubernetes streaming tests
        run: |
          mkdir -p .local/bin
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl -o "$TEST_KUBECTL"
          echo '874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf  .local/bin/kubectl' | sha256sum --check --strict
          chmod 0755 "$TEST_KUBECTL"
      - name: Verify generated contract and agent routes
        run: |
          python3 api/generate.py
          python3 -B api/check_route_coverage.py
          git diff --exit-code -- api/openapi.json web/src/server/agent-routes.generated.ts
      - run: go test ./...
      - name: Oracle decoder receive limits and private diagnostics
        working-directory: third_party/go-ora-v3
        run: |
          go test . ./network -count=1
          go test -tags hakopod_native_acceptance . ./network -count=1
      - name: Check signup build policies
        run: |
          go test -tags=hakopod_cloud ./cmd/hakopod-server
          go test -tags=hakopod_cloud,hakopod_selfhosted ./cmd/hakopod-server
      - name: Verify separate native acceptance build
        run: |
          go test -tags=hakopod_native_acceptance ./internal/nativeacceptance ./internal/api ./internal/cluster ./internal/store ./internal/managedplatform
          go test -tags=hakopod_native_acceptance ./cmd/hakopod-server -run '^$'
      - run: go vet ./...
      - run: go build ./cmd/...
      - name: Check scripts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          bash -n scripts/local-tools.sh scripts/local-up.sh scripts/local-down.sh scripts/install.sh scripts/build-managed-oracle-free.sh scripts/build-managed-myduck.sh release/install-syft.sh deploy/cert-manager/install.sh
          python3 -m py_compile scripts/*.py api/generate.py api/contracts/*.py examples/shop/variants.py tests/restart.py release/*.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s installer -p 'test_*.py'
          python3 -m unittest discover -s release -p 'test_*.py'
          for test in scripts/test-development-*.py scripts/test-managed-oracle-wallet.py scripts/test-package-managed-oracle-free.py; do
            python3 -B "$test"
          done
          python3 -B scripts/test-oracle-free-http-fixtures.py
          python3 -B scripts/test-supabase-qualification.py
          python3 -B scripts/test-supabase-cancellation.py
          python3 -B scripts/test-supabase-held-review.py
          python3 -B scripts/test-neon-qualification.py
          python3 -B scripts/test-neon-native-driver.py
          python3 -B scripts/test-neon-native-trust.py
          python3 -B scripts/actions/export-benchmark-test.py
          python3 -B scripts/actions/docker-acceptance-test.py
          python3 -B scripts/actions/runtime-workload-test.py
          python3 -B scripts/actions/shared-workspace-test.py
          python3 -B scripts/actions/service-pull-benchmark-test.py
          python3 -B scripts/actions/buildkit-integration-test.py
          python3 -B scripts/actions/buildkit-qualification-test.py
          sh -n scripts/installer.sh
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore public template catalog
        run: git submodule update --init templates
        working-directory: .
      - name: Restore public design-system sources
        run: python3 scripts/ui-source.py restore
        working-directory: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify generated dashboard API and editor schema
        run: |
          pnpm generate:api
          git diff --exit-code -- src/lib/api.generated.ts src/lib/editor-schema.json
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Test and inspect the @hakopod/cloud package
        working-directory: packages/cli
        run: |
          npm test
          npm pack --dry-run
      - name: Check the @hakopod/cli wrapper sources
        working-directory: .
        run: |
          node --check packages/cli-binary/bin/hakopod.mjs
          node --check packages/cli-binary/generate.mjs
