name: Managed Actions Docker runtime
on:
  push:
    branches: ['main']
    paths: &runtime_paths
      - 'scripts/actions/**'
      - 'internal/cluster/**'
      - 'internal/spec/**'
      - 'images/actions-runner/**'
      - 'installer/actions_runtime.py'
      - 'scripts/local-*.sh'
      - 'deploy/local/**'
      - 'deploy/charts/hakopod-platform/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/actions-runtime.yml'
  pull_request:
    paths: *runtime_paths
  workflow_dispatch:
    inputs:
      buildkit_candidate:
        description: Build and test the managed BuildKit candidate instead of running acceptance
        type: boolean
        default: false
      publish_candidate:
        description: Publish immutable candidate images after the candidate build passes
        type: boolean
        default: false
      export_benchmark:
        description: Compare image export speed and verify image contents
        type: boolean
        default: false
      buildkit_qualification:
        description: Verify candidate metadata and registry-cache restoration in a separate pod run
        type: boolean
        default: false
      export_buildkit_image:
        description: Digest-pinned candidate for qualification, or optional export benchmark candidate
        type: string
        default: ''
      export_force_overlay_diff:
        description: Diagnose the selected scenario's optimized overlay path without fallback
        type: boolean
        default: false
      export_buildkit_test_run:
        description: Optional candidate build run ID supplying matching native kernel test artifacts
        type: string
        default: ''
      runtime_buildkit_image:
        description: Optional digest-pinned candidate for the full runtime and emulation suite
        type: string
        default: ''
      runtime_force_overlay_diff:
        description: Force overlay diff in the full runtime suite; requires runtime_buildkit_image
        type: boolean
        default: false
      shared_workspace:
        description: Experiment with a disk-backed pod-shared workspace in the disposable development runtime
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: actions-runtime-${{ github.event.pull_request.number || github.ref }}-${{ inputs.shared_workspace && 'shared-workspace' || 'direct-workspace' }}-${{ inputs.runtime_force_overlay_diff && 'forced-candidate-runtime' || inputs.runtime_buildkit_image != '' && 'candidate-runtime' || inputs.buildkit_candidate && 'candidate-build' || inputs.buildkit_qualification && 'qualification' || inputs.export_buildkit_test_run != '' && 'kernel-tests' || inputs.export_force_overlay_diff && 'forced-export' || (inputs.export_benchmark || inputs.export_buildkit_image != '') && 'export' || 'normal-runtime' }}
  cancel-in-progress: true
env:
  HAKOPOD_ACTIONS_BUILDKIT_CANDIDATE: ${{ inputs.buildkit_candidate && '1' || '0' }}
  HAKOPOD_ACTIONS_PUBLISH_CANDIDATE: ${{ inputs.publish_candidate && '1' || '0' }}
  HAKOPOD_ACTIONS_EXPORT_BENCHMARK: ${{ !inputs.buildkit_qualification && (inputs.export_benchmark || inputs.export_buildkit_image != '' || inputs.export_force_overlay_diff || inputs.export_buildkit_test_run != '') && '1' || '0' }}
  HAKOPOD_ACTIONS_BUILDKIT_QUALIFICATION: ${{ inputs.buildkit_qualification && '1' || '0' }}
  HAKOPOD_ACTIONS_EXPORT_BUILDKIT_IMAGE: ${{ inputs.export_buildkit_image }}
  HAKOPOD_ACTIONS_EXPORT_FORCE_OVERLAY_DIFF: ${{ inputs.export_force_overlay_diff && '1' || '0' }}
  HAKOPOD_ACTIONS_EXPORT_INTEGRATION_TESTS: ${{ inputs.export_buildkit_test_run != '' && '1' || '0' }}
  HAKOPOD_ACTIONS_EXPORT_TEST_RUN: ${{ inputs.export_buildkit_test_run }}
  HAKOPOD_ACTIONS_RUNTIME_BUILDKIT_IMAGE: ${{ inputs.runtime_buildkit_image }}
  HAKOPOD_ACTIONS_RUNTIME_FORCE_OVERLAY_DIFF: ${{ inputs.runtime_force_overlay_diff && '1' || '0' }}
  HAKOPOD_ACTIONS_SHARED_WORKSPACE: ${{ inputs.shared_workspace && '1' || '0' }}
jobs:
  validate-scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate explicit runtime selection before building or starting a cluster
        run: |
          if [ '${{ inputs.buildkit_qualification && inputs.export_benchmark }}' = 'true' ]; then
            echo 'BuildKit qualification must run separately from export benchmarks.'
            exit 1
          fi
          python3 -B scripts/actions/runtime-workload.py --validate-selection
  buildkit-candidate:
    needs: validate-scenario
    if: ${{ inputs.buildkit_candidate && !inputs.buildkit_qualification }}
    uses: ./.github/workflows/buildkit-image.yml
    with:
      publish_candidate: ${{ inputs.publish_candidate }}
    permissions:
      contents: read
      packages: write
  runtime:
    needs: validate-scenario
    if: ${{ !inputs.buildkit_candidate && !(inputs.buildkit_qualification && (inputs.export_benchmark || inputs.export_buildkit_test_run != '')) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      HAKOPOD_DEV_SERVER_MEMORY: 6g
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      HAKOPOD_ACTIONS_EXPORT_TESTS_DIR: ${{ github.workspace }}/.local/buildkit-tests/${{ matrix.arch }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git submodule update --init templates
      - name: Download explicitly selected native test artifacts
        if: inputs.export_buildkit_test_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: buildkit-tests-${{ matrix.arch }}
          path: .local/buildkit-test-download
          run-id: ${{ inputs.export_buildkit_test_run }}
          github-token: ${{ github.token }}
      - name: Verify native test source, architecture and checksums
        if: inputs.export_buildkit_test_run != ''
        run: |
          mkdir -p .local/buildkit-tests
          python3 scripts/actions/buildkit-integration.py \
            --archive ".local/buildkit-test-download/buildkit-tests-${ARCH}.tar.gz" \
            --destination "$HAKOPOD_ACTIONS_EXPORT_TESTS_DIR" \
            --image "$HAKOPOD_ACTIONS_EXPORT_BUILDKIT_IMAGE" \
            --architecture "$ARCH" --run-id "$HAKOPOD_ACTIONS_EXPORT_TEST_RUN"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.2
      - name: Compile the product fixture before runtime measurement
        run: |
          if [ "$HAKOPOD_ACTIONS_BUILDKIT_QUALIFICATION" = '1' ]; then
            go test -p=1 ./internal/cluster -run '^TestActionsBuildkitQualificationFixture$' -count=1
          elif [ "$HAKOPOD_ACTIONS_EXPORT_BENCHMARK" = '1' ]; then
            go test -p=1 ./internal/cluster -run '^TestActionsExportBenchmarkFixture$' -count=1
          else
            go test -p=1 ./internal/cluster -run '^TestActionsRuntimeAcceptanceFixtures$' -count=1
          fi
      - name: Start disposable named development cluster
        run: scripts/local-up.sh
      - name: Install pinned isolated Docker runtime
        run: |
          python3 scripts/actions/setup-dev-runtime.py
          sleep 10
          kubectl --kubeconfig .local/kubeconfig --context k3d-hakopod-dev wait --for=condition=Ready nodes --all --timeout=180s
      - name: Verify Docker workloads inside gVisor
        run: python3 scripts/actions/docker-acceptance.py
      - name: Preserve bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actions-runtime-${{ matrix.runner }}
          path: |
            .local/actions-runtime-acceptance/report.json
            .local/actions-runtime-acceptance/export-benchmark-report.json
            .local/actions-runtime-acceptance/buildkit-qualification-report.json
            .local/actions-runtime-acceptance/*.log
            .local/actions-runtime-acceptance/*-pods.txt
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
      - name: Stop disposable development resources
        if: always()
        run: scripts/local-down.sh
